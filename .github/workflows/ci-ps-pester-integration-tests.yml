name: Pester Integration Tests

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ 'feature/*', 'enhancement/*', 'bug/*', 'dev' ]

jobs:
  build:
    uses: ./.github/workflows/ci-ps-shared-build.yml

  download-build:
    runs-on: windows-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ github.token }}
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: PSMinecraftServerManager
          path: ${{ runner.temp }}\MinecraftServerManager
  tests-windows:
    needs: download-build
    runs-on: windows-latest
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Integration Tests
      id: IntegrationTests
      shell: pwsh
      run: |
        Import-Module "${{ runner.temp }}\MinecraftServerManager\MinecraftServerManager.psd1"
        .\tools\pester.ps1 -Tags "Integration" -TestPath "${{ github.workspace }}\tests" -CodePath "${{ github.workspace }}\src"
  tests-linux:
    needs: download-build
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Unit Tests
      id: UnitTests
      shell: pwsh
      run: |
        Import-Module "${{ runner.temp }}\MinecraftServerManager\MinecraftServerManager.psd1"
        .\tools\pester.ps1 -Tags "Integration" -TestPath "${{ github.workspace }}\tests" -CodePath "${{ github.workspace }}\src"
