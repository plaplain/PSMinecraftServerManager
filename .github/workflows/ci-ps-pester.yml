name: Pester Tests

on:
  workflow_dispatch: 
  push:
    branches:
      - 'feature/**'

jobs:
  tests:
    runs-on: windows-latest
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Unit Tests
      id: UnitTests
      shell: pwsh
      run: |
        .\tools\pester.ps1 -Tags "Unit" -TestPath "${{ github.workspace }}\tests" -CodePath "${{ github.workspace }}\src"
