name: Testing with Pester

on:
  workflow_dispatch: 
  push:
    branches:
      - 'feature/**'

jobs:
  tests:
    runs-on: windows-latest
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Unit Tests
      id: UnitTests
      shell: pwsh
      run: |
        pwsh -File .\tools\pester.ps1 -Tags "Unit" -TestPath "${{ github.workspace }}\tests" -CodePath "${{ github.workspace }}\src" -OutputPath "${{ runner.temp }}\test-results"

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: pester-results
        path: ${{ runner.temp }}\test.xml
        retention-days: 1
