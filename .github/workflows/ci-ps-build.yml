name: Build and Publish PowerShell Module

on:
  workflow_dispatch: 
  push:
    branches:
      - 'feature/**'

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set Latest Tag and Update Module
      id: version
      shell: pwsh
      run: |
        & ${{ github.workspace }}\tools\set-version.ps1

    - name: Build PS Manifest
      id: psmanifest
      shell: pwsh
      run: |
        & ${{ github.workspace }}\tools\set-version.ps1

    - name: Create Artifact
      shell: pwsh
      run: |
        & ${{ github.workspace }}\tools\new-artifact.ps1

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: PSMinecraftServerManager
        path: ${{ github.workspace }}\src
        retention-days: 1

    - name: Push Changes
      shell: pwsh
      run: |
        # Only proceed if we're on main branch
        if ($env:GITHUB_REF -ne "refs/heads/main") {
          Write-Output "Not on main branch, skipping push"
          exit 0
        }
        
        # Push tag and changes
        git push origin --tags
        git push origin main
